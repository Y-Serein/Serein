services:
  dev:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    init: true
    working_dir: /workspace
    environment:
      HOME: /home/vscode
      CARGO_HOME: /home/vscode/.cargo
      CARGO_TARGET_DIR: /home/vscode/.cache/serein-tauri-target
      npm_config_cache: /home/vscode/.cache/npm
      SEREIN_WORKSPACE: /workspace
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: volume
        source: node_modules
        target: /workspace/apps/serein-desktop/node_modules
      - type: volume
        source: web_dist
        target: /workspace/apps/serein-desktop/dist
      - type: volume
        source: npm_cache
        target: /home/vscode/.cache/npm
      - type: volume
        source: cargo_registry
        target: /home/vscode/.cargo/registry
      - type: volume
        source: cargo_git
        target: /home/vscode/.cargo/git
      - type: volume
        source: tauri_target
        target: /home/vscode/.cache/serein-tauri-target
    ports:
      - "${SEREIN_VITE_PORT:-1420}:1420"
    command: ["bash"]

volumes:
  node_modules:
  web_dist:
  npm_cache:
  cargo_registry:
  cargo_git:
  tauri_target:
