<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151518" />
    <title>Serein</title>
    <style>
      :root {
        color-scheme: dark;
        background: #151518;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #151518;
      }

      #root:empty::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          linear-gradient(180deg, #151518 0 76px, transparent 76px),
          linear-gradient(90deg, #111113 0 44px, #1b1b1f 44px 284px, #1f1f23 284px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
