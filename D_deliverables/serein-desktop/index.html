<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b9ddd2" />
    <title>Serein</title>
    <style>
      :root {
        color-scheme: light;
        background: #b9ddd2;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #b9ddd2;
      }

      #root:empty::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          linear-gradient(180deg, #b9ddd2 0 76px, transparent 76px),
          linear-gradient(90deg, #b9ddd2 0 44px, #e3f2ec 44px 284px, #eff9f4 284px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
